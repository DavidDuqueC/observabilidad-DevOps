name: Deploy Monitoring to EC2

on:
  push:
    paths:
      - 'monitoring/**'
  workflow_dispatch:  # Permite activarlo manualmente también si lo deseas

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to EC2 and Deploy Monitoring
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/10-11-26
            git pull origin main
            # Ajusta si tu comando o archivo de docker-compose para monitoreo tiene otro nombre o ruta
            docker compose -f docker-compose.yml up -d prometheus grafana
